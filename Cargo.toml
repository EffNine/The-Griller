[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Griller Project"]
repository = "https://github.com/EffNine/The-Griller"

[workspace.dependencies]
griller-core = { path = "crates/griller-core" }
griller-runtime = { path = "crates/griller-runtime" }
griller-adjudicate = { path = "crates/griller-adjudicate" }
griller-policy = { path = "crates/griller-policy" }
griller-context = { path = "crates/griller-context" }
griller-self-grill = { path = "crates/griller-self-grill" }

serde = "1.0"
serde_json = "1.0"
blake3 = "1.8"
thiserror = "2.0"
tempfile = "3.27"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
lto = true
