[package]
name = "griller-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP adapter: six public tools for The Griller."

[[bin]]
name = "griller-mcp"
path = "src/main.rs"

[dependencies]
griller-core = { workspace = true }
griller-runtime = { workspace = true }
griller-adjudicate = { workspace = true }
griller-context = { workspace = true }
griller-policy = { workspace = true }
griller-self-grill = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
rust-mcp-sdk = { version = "1.0.1", features = ["stdio", "server", "macros"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
griller-policy = { workspace = true }
rust-mcp-sdk = { version = "1.0.1", features = ["stdio", "server", "macros", "client"] }
